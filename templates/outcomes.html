<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>UseItFirst -- Outcome log</title>
<style>body { font-family: system-ui, sans-serif; background: #111; color: #eee; max-width: 760px; margin: 2rem auto; padding: 0 1rem; } a { color: #a78bfa; }</style>
</head>
<body>
<h1>Outcome log</h1>
<p><a href="/">Back to fridge</a></p>
{% for item in items %}
<p>{{ item.name }} -- {{ item.outcome }} on {{ item.outcome_at }}</p>
{% else %}
<p>No outcomes logged yet.</p>
{% endfor %}
</body>
</html>
